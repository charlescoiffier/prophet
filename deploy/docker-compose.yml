# Déploiement de paroletenue.charlescoiffier.fr (modèle ~/dev/vps-infra, étendu pour Laravel).
# Copié sur le VPS dans ~/srv/paroletenue/ à chaque déploiement par .github/workflows/deploy.yml.
# Secrets et réglages propres au serveur : ~/srv/paroletenue/.env (jamais dans git, voir deploy/env.example).
#
# VPS : 1 cœur, 3,8 Go partagés avec d'autres sites. Limites : ~1,4 Go et 1,5 CPU au total.

x-app: &app
  image: ghcr.io/charlescoiffier/prophet:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: true
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://paroletenue.charlescoiffier.fr
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: prophet
    DB_USERNAME: prophet
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  pids_limit: 200
  security_opt:
    - no-new-privileges:true

services:
  # Site public, API et panneau de modération (Nginx + PHP-FPM, port 8080).
  # Au démarrage : migrations, caches (AUTORUN_ENABLED, défini dans le Dockerfile).
  app:
    <<: *app
    networks: [web, internal]
    mem_limit: 384m
    cpus: 0.6
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.paroletenue.rule=Host(`paroletenue.charlescoiffier.fr`)
      - traefik.http.routers.paroletenue.tls.certresolver=le
      - traefik.http.services.paroletenue.loadbalancer.server.port=8080
      # Mot de passe pendant les tests : BASIC_AUTH_USERS dans ~/srv/paroletenue/.env.
      # Pour ouvrir le site au public, supprimer ces deux lignes.
      - traefik.http.routers.paroletenue.middlewares=paroletenue-auth
      - traefik.http.middlewares.paroletenue-auth.basicauth.users=${BASIC_AUTH_USERS:?BASIC_AUTH_USERS manquant dans .env}

  # Files d'attente : e-mails, archivage Wayback des sources (Horizon).
  horizon:
    <<: *app
    command: ["php", "/var/www/html/artisan", "horizon"]
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 15s
    # ~200 Mo au repos (maître + superviseur) ; chaque processus de travail ajoute ~60 Mo.
    mem_limit: 384m
    cpus: 0.3

  # Planificateur : purge des cartes non confirmées, relance de l'archivage.
  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 15s
    mem_limit: 128m
    cpus: 0.2

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prophet
      POSTGRES_USER: prophet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prophet -d prophet"]
      interval: 10s
      retries: 5
    networks: [internal]
    mem_limit: 384m
    cpus: 0.3
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [internal]
    mem_limit: 128m
    cpus: 0.1
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:

networks:
  web:
    external: true
  internal:
